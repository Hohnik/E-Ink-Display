[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = ["espflash", "flash", "--baud", "460800", "--flash-size", "4mb", "--flash-mode", "dio", "--flash-freq", "40mhz", "--partition-table", "partitions.csv", "--bootloader", "target/xtensa-esp32-espidf/release/bootloader.bin", "--monitor"]

[unstable]
build-std = ["std", "panic_abort"]
