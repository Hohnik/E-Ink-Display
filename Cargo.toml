[package]
name = "japanese-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "japanese_core"
path = "src/lib.rs"

[dependencies]
embedded-hal = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 1
panic = "abort"
